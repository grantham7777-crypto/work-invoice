<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14233b"><link rel="manifest" href="manifest.webmanifest"><title>Work Invoice</title><style>body{margin:0;background:#eef2f7;font:16px system-ui;color:#14233b}header{background:#14233b;color:white;padding:24px 18px}h1{margin:0;font-size:26px}main{max-width:650px;margin:auto;padding:16px}section{background:white;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 12px #14233b12}h2{font-size:19px;margin:0 0 12px}label{display:block;font-weight:600;font-size:14px;margin:12px 0 5px}input,textarea,select{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}textarea{min-height:80px}button{border:0;background:#1768d1;color:white;border-radius:10px;padding:13px 16px;font-weight:700;font-size:16px;margin-top:12px;cursor:pointer}button.secondary{background:#e4ebf5;color:#14233b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.summary{display:flex;justify-content:space-between;font-weight:700;padding:10px 0;border-top:1px solid #ddd}.entry{border-bottom:1px solid #eee;padding:12px 0}.muted{color:#64748b;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}@media print{header,.editor,.actions,.no-print{display:none!important}body{background:white}section{box-shadow:none}main{max-width:none}}</style></head><body><header><h1>Work Invoice</h1><div>Track jobs • Log hours • Create invoices</div></header><main><section class="editor"><h2>Add work</h2><label>Date</label><input id="date" type="date"><div class="grid"><div><label>Start</label><input id="start" type="time"></div><div><label>Finish</label><input id="end" type="time"></div></div><label>Unit / Job</label><input id="unit" placeholder="4221"><label>Model / Category</label><input id="model" placeholder="Bodie Stock or Lot Work"><label>Work performed</label><textarea id="notes" placeholder="Patch cracks, sand, paint..."></textarea><label>Hourly rate ($)</label><input id="rate" type="number" value="50" min="0" step="0.01"><label>Rounding</label><select id="round"><option value="nearest">Nearest whole hour</option><option value="exact">Exact time</option></select><button id="add">Save work entry</button></section><section><h2>Invoice</h2><div class="editor"><label>Bill to</label><input id="client" value="Bob"><label>Invoice number</label><input id="number" placeholder="INV-001"></div><div id="entries"></div><div class="summary"><span>Total hours</span><span id="hours">0</span></div><div class="summary"><span>Amount due</span><span id="total">$0.00</span></div><div class="actions"><button onclick="window.print()">Print / Save PDF</button><button class="secondary" id="export">Back up data</button><button class="secondary" id="importBtn">Restore backup</button><input style="display:none" id="import" type="file" accept="application/json"></div></section><p class="muted">Records are saved on this device. Back up your data regularly. Sync between devices is not yet included.</p></main><script>const $=id=>document.getElementById(id),key='work_invoice_v1';let data;try{data=JSON.parse(localStorage.getItem(key))||{entries:[],client:'Bob',number:''}}catch{data={entries:[],client:'Bob',number:''}}$('date').value=new Date().toLocaleDateString('en-CA');$('client').value=data.client;$('number').value=data.number;function persist(){data.client=$('client').value;data.number=$('number').value;localStorage.setItem(key,JSON.stringify(data))}function money(x){return '$'+x.toFixed(2)}function render(){let h=0,t=0;$('entries').innerHTML='';data.entries.forEach((e,i)=>{h+=e.hours;t+=e.hours*e.rate;let d=document.createElement('div');d.className='entry';let heading=document.createElement('strong');heading.textContent=[e.date,e.unit,e.model].filter(Boolean).join(' · ');d.append(heading);let p=document.createElement('div');p.textContent=e.notes;d.append(p);let detail=document.createElement('div');detail.className='muted';detail.textContent=`${e.start}–${e.end} · ${e.hours} hr × ${money(e.rate)} = ${money(e.hours*e.rate)}`;d.append(detail);let del=document.createElement('button');del.className='secondary editor';del.textContent='Delete';del.onclick=()=>{if(confirm('Delete this work entry?')){data.entries.splice(i,1);persist();render()}};d.append(del);$('entries').append(d)});$('hours').textContent=Number(h.toFixed(2));$('total').textContent=money(t)}$('add').onclick=()=>{let date=$('date').value,start=$('start').value,end=$('end').value,rate=Number($('rate').value);if(!date||!start||!end||!$('notes').value.trim()||!Number.isFinite(rate)||rate<0){alert('Enter a date, start, finish, description and valid rate.');return}let [sh,sm]=start.split(':').map(Number),[eh,em]=end.split(':').map(Number),mins=(eh*60+em)-(sh*60+sm);if(mins<=0)mins+=1440;let hours=$('round').value==='nearest'?Math.round(mins/60):Math.round(mins/60*100)/100;data.entries.push({date,start,end,unit:$('unit').value.trim(),model:$('model').value.trim(),notes:$('notes').value.trim(),rate,hours});persist();render();$('notes').value='';alert('Work saved')};$('client').onchange=persist;$('number').onchange=persist;$('export').onclick=()=>{persist();let a=document.createElement('a'),blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='work-invoice-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('importBtn').onclick=()=>$('import').click();$('import').onchange=async e=>{try{let obj=JSON.parse(await e.target.files[0].text());if(!Array.isArray(obj.entries))throw Error();if(confirm('Replace saved work with this backup?')){data=obj;$('client').value=obj.client||'';$('number').value=obj.number||'';persist();render()}}catch{alert('Invalid backup file')}};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
